name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Gate 0 — the constitution's change-management rule, enforced rather than trusted.
  commit-messages:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint every commit in the pull request
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          while read -r sha; do
            header=$(git log -1 --pretty=%s "$sha")
            if [[ ! "$header" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?:\ .{1,90}$ ]]; then
              echo "::error::$sha is not a Conventional Commit: $header"
              fail=1
            fi
          done < <(git rev-list "$base".."$head")
          exit $fail

  # Gates 1, 2, 3, 4, 6.
  #   1 format and lint      — Spotless, bound to verify
  #   2 static analysis      — compiler + ArchUnit layer, credential-scope and security rules
  #   3 tests and coverage   — full suite; Jacoco fails below the thresholds
  #   4 contract conformance — every response validated against the authored OpenAPI document
  #   6 migrations           — Dev Services provisions a fresh database per run; Flyway applies to it
  build:
    name: Build, test, contract, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Gate 4b — the authored contract is the source of truth; the code must match it, never the reverse.
  contract-drift:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: pip install --quiet pyyaml
      - name: Generate and compare
        run: |
          mvn -B -DskipTests package
          python3 scripts/contract-drift.py

  # Gate 5 — a known high or critical advisory blocks release.
  vulnerabilities:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: mvn -B -Psecurity dependency-check:check
