# Host ports are pinned deliberately: quickstart.md documents commands against them.
services:
  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: quicknote
      POSTGRES_USER: quicknote
      POSTGRES_PASSWORD: quicknote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quicknote -d quicknote"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180", "--health-enabled=true"]
    ports: ["8180:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
    # The Keycloak image ships no curl, so the probe reaches the management health endpoint
    # through bash's /dev/tcp rather than through an HTTP client that is not there.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Migrations run as a discrete deploy step, never at application start.
  flyway:
    image: flyway/flyway:11-alpine
    command: -url=jdbc:postgresql://postgres:5432/quicknote -user=quicknote -password=quicknote -connectRetries=30 migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres: {condition: service_healthy}

  app:
    build: .
    ports: ["8080:8080"]
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/quicknote
      QUARKUS_DATASOURCE_USERNAME: quicknote
      QUARKUS_DATASOURCE_PASSWORD: quicknote
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/quicknote
      QUARKUS_OIDC_CLIENT_ID: quicknote-api
    depends_on:
      flyway: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
