# ---------------------------------------------------------------------------
# Quick Note — configuration.
# Everything here comes from the environment in prod; the values below are
# defaults and local-development wiring. The service validates required values
# at startup and refuses to start when one is missing (QuickNoteConfig).
# ---------------------------------------------------------------------------

quarkus.application.name=quick-note
# Served in non-production profiles only, and authenticated even there.
quarkus.smallrye-openapi.enable=false
%dev.quarkus.smallrye-openapi.enable=true
%test.quarkus.smallrye-openapi.enable=true
quarkus.swagger-ui.always-include=false
# The authored contract is authoritative; this output exists only so CI can detect drift.
quarkus.smallrye-openapi.store-schema-directory=target/generated
quarkus.smallrye-openapi.info-title=Quick Note — Note Management API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.http.root-path=/
# Unknown properties are rejected, not silently persisted.
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false

# --- Security: deny by default, enforced on the resources themselves.
# Eager path-based permissions answer 401 below the JAX-RS layer, with an empty body, which would
# break the rule that every error is an RFC 9457 problem document. Instead every resource class
# carries @Authenticated, and ResourceSecurityTest fails the build if one does not — a rule the
# compiler checks beats a rule a config file states.
quarkus.http.auth.proactive=false

# Metrics and the OpenAPI document are served by framework routes, below the JAX-RS filter, so they
# need an explicit path policy or they would be implicitly public — which the constitution forbids.
# They are declared here rather than left to chance: /q/metrics exposes traffic shape and route
# templates, and neither it nor the schema is anyone's business but the operator's.
quarkus.http.auth.permission.observability.paths=/q/metrics,/q/openapi,/q/swagger-ui/*
quarkus.http.auth.permission.observability.policy=authenticated

# --- Identity: verified here, issued elsewhere. Never web-app.
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any
quarkus.oidc.client-id=quicknote-api

# --- Transport limits. The byte ceiling is an abuse guard set far above any
# --- legitimate note (a maximal note is ~82 KB of UTF-8); content limits are
# --- counted in characters and enforced by validation, which names the field.
quarkus.http.limits.max-body-size=256K
quarkus.http.limits.max-header-size=8K
quarkus.http.read-timeout=30S
quarkus.http.idle-timeout=60S

# --- Persistence
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.datasource.db-kind=postgresql

# --- Migrations: versioned, forward-only, and a discrete deploy step in prod.
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=false

# --- Observability
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=quick-note
quarkus.micrometer.binder.http-server.enabled=true
quarkus.otel.enabled=true
# No collector locally; exporting would fail noisily on every run.
%dev.quarkus.otel.traces.exporter=none
%test.quarkus.otel.traces.exporter=none

# --- Scheduling: clustered so the retention sweep runs exactly once across instances.
quarkus.quartz.clustered=true
quarkus.quartz.store-type=jdbc-cmt

# --- Behaviour
quicknote.trash.retention-days=30
# Nightly, off-peak. Clustered, so exactly one instance runs it.
quicknote.trash.purge-cron=0 30 3 * * ?
quicknote.ratelimit.per-principal=600
quicknote.ratelimit.per-ip=1200
# Instance-local: the effective ceiling scales with replica count. Recorded as a deviation in
# plan.md, to be moved to the gateway or a shared store when this runs on more than two instances.

# ---------------------------------------------------------------------------
# dev: Dev Services provisions PostgreSQL and Keycloak. The Keycloak port is
# pinned here so the issuer URL matches the one quickstart.md documents; the
# database port is left dynamic on purpose.
# ---------------------------------------------------------------------------
%dev.quarkus.keycloak.devservices.port=8180
%dev.quarkus.keycloak.devservices.realm-path=docker/keycloak/quicknote-realm.json
%dev.quarkus.flyway.migrate-at-start=true
%dev.quarkus.log.console.json.enabled=false

# ---------------------------------------------------------------------------
# test: same Dev Services, but the Keycloak port stays random so parallel test
# runs cannot collide on it.
# ---------------------------------------------------------------------------
%test.quarkus.keycloak.devservices.realm-path=docker/keycloak/quicknote-realm.json
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.log.category."io.quarkus.oidc".level=INFO
%test.quarkus.log.category."io.quarkus.vertx.http.runtime.security".level=DEBUG
%test.quarkus.log.console.json.enabled=false
%test.quarkus.quartz.clustered=false
%test.quarkus.quartz.store-type=ram
# High enough that the ordinary suite never trips the limiter; RateLimitTest sets its own.
%test.quicknote.ratelimit.per-principal=100000
%test.quicknote.ratelimit.per-ip=100000
